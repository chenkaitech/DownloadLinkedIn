<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>LinkedIn Video Downloader</title>
  <style>
    body { width: 360px; margin: 0; font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #1d2226; background: #fff; }
    header { padding: 12px 14px; background: #0a66c2; color: #fff; font-weight: 600; font-size: 14px; }
    main { padding: 10px 14px 14px; max-height: 480px; overflow-y: auto; }
    h3 { font-size: 12px; color: #666; margin: 12px 0 6px; text-transform: uppercase; letter-spacing: .03em; }
    .item { display: flex; gap: 8px; align-items: center; padding: 8px; border: 1px solid #e0e0e0; border-radius: 8px; margin-bottom: 6px; }
    .item img { width: 64px; height: 36px; object-fit: cover; border-radius: 4px; background: #eee; flex: none; }
    .item .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; }
    button { flex: none; border: none; border-radius: 14px; padding: 5px 12px; background: #0a66c2; color: #fff; font-weight: 600; cursor: pointer; }
    button:hover { background: #004182; }
    button:disabled { background: #999; cursor: default; }
    .empty { color: #666; padding: 8px 0; }
  </style>
</head>
<body>
  <header>LinkedIn 视频下载</header>
  <main>
    <h3>页面中的视频</h3>
    <div id="page"></div>
  </main>
  <script src="popup.js"></script>
</body>
</html>
